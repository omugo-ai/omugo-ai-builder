<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMUGO AI 3.0 - Build Any Website</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-[#fafafa] text-black">
<!-- HEADER -->
<header class="bg-black text-white py-4 px-6 flex justify-between items-center sticky top-0 z-50">
<div class="flex items-center gap-2 font-bold text-xl"><span class="bg-[#D4AF37] text-black w-8 h-8 rounded-full flex items-center justify-center">OE</span> OMUGO AI 3.0</div>
<div class="flex gap-3 text-sm"><span>Home</span><span>Categories</span><span>Seller Center</span><span>Wishlist</span><span>Cart</span></div>
</header>

<div class="max-w-7xl mx-auto p-6 grid md:grid-cols-2 gap-8 mt-6">
<!-- BUILDER -->
<div class="bg-white rounded-[24px] shadow-xl p-6 border border-gray-100">
<h2 class="text-2xl font-bold mb-4">Build Your Website</h2>
<div class="flex gap-2 mb-4">
<button id="tabPrompt" onclick="switchTab('prompt')" class="bg-black text-white px-4 py-2 rounded-full text-sm">Prompt</button>
<button id="tabUrl" onclick="switchTab('url')" class="bg-gray-100 px-4 py-2 rounded-full text-sm">URL</button>
<button id="tabImage" onclick="switchTab('image')" class="bg-gray-100 px-4 py-2 rounded-full text-sm">Image</button>
</div>

<div id="panelPrompt">
<textarea id="promptInput" class="w-full border border-gray-300 rounded-[16px] p-4 h-40 text-sm" placeholder="Describe any business - e.g. Build premium farm shop EMMANUEL CLEMENT FARMS Abomey-Calavi sells Yams, Beans, Okra, Rice... OR Build mechanic workshop in Cotonou with spanner tools garage... OR Build beauty salon..."></textarea>
<button onclick="buildWebsite()" class="mt-4 w-full bg-black text-white py-4 rounded-full font-bold shadow-lg hover:scale-[1.02] transition">Build My Website Now</button>
<p id="statusText" class="text-xs mt-3 text-gray-500 text-center"></p>
</div>

<div id="panelUrl" class="hidden">
<input id="urlInput" class="w-full border rounded-[16px] p-4 text-sm" placeholder="https://example.com">
<button onclick="scrapeUrl()" class="mt-3 w-full bg-[#D4AF37] text-black py-3 rounded-full font-bold">Import from URL</button>
</div>

<div id="panelImage" class="hidden">
<input type="file" id="imageInput" accept="image/*" class="w-full text-sm">
<button onclick="uploadImage()" class="mt-3 w-full bg-[#0A7A0A] text-white py-3 rounded-full font-bold">Use This Image</button>
<img id="imgPreview" class="mt-4 rounded-[16px] hidden w-full">
</div>

<div class="mt-6 flex gap-2">
<button onclick="publishSite()" class="flex-1 bg-black text-white py-3 rounded-full text-sm font-bold">Publish</button>
<button onclick="downloadSite()" class="flex-1 bg-white border border-black py-3 rounded-full text-sm font-bold">Download</button>
<a id="liveLink" target="_blank" class="flex-1 bg-[#D4AF37] text-black py-3 rounded-full text-sm font-bold text-center hidden">Live Link</a>
</div>
<p class="text-[10px] text-center mt-3 text-gray-400">Leads go to WhatsApp: +2347035399931</p>
</div>

<!-- PREVIEW -->
<div class="bg-white rounded-[24px] shadow-xl border border-gray-100 overflow-hidden">
<div class="bg-gray-100 px-4 py-2 text-xs font-bold flex justify-between"><span>Live Preview</span><span id="previewStatus">Ready</span></div>
<iframe id="previewFrame" class="w-full h-[700px] border-0 bg-white"></iframe>
</div>
</div>

<footer class="bg-black text-white text-center py-8 mt-12 text-xs">
© <span id="year"></span> OMUGO EMPIRE All rights reserved Built with OMUGO AI
</footer>

<script>
document.getElementById('year').innerText = new Date().getFullYear();
let currentHtml = "";
let tries = 0;

function switchTab(t){
 document.getElementById('panelPrompt').classList.add('hidden');
 document.getElementById('panelUrl').classList.add('hidden');
 document.getElementById('panelImage').classList.add('hidden');
 document.getElementById('tabPrompt').className="bg-gray-100 px-4 py-2 rounded-full text-sm";
 document.getElementById('tabUrl').className="bg-gray-100 px-4 py-2 rounded-full text-sm";
 document.getElementById('tabImage').className="bg-gray-100 px-4 py-2 rounded-full text-sm";
 if(t=='prompt'){document.getElementById('panelPrompt').classList.remove('hidden');document.getElementById('tabPrompt').className="bg-black text-white px-4 py-2 rounded-full text-sm";}
 if(t=='url'){document.getElementById('panelUrl').classList.remove('hidden');document.getElementById('tabUrl').className="bg-black text-white px-4 py-2 rounded-full text-sm";}
 if(t=='image'){document.getElementById('panelImage').classList.remove('hidden');document.getElementById('tabImage').className="bg-black text-white px-4 py-2 rounded-full text-sm";}
}

async function scrapeUrl(){
 let url=document.getElementById('urlInput').value.trim();
 if(!url) return alert("Paste URL sir");
 document.getElementById('previewStatus').innerText="Scraping...";
 try{
  let r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url));
  let d=await r.json();
  document.getElementById('promptInput').value="Recreate this website premium Hostinger-level using this content: "+d.contents.substring(0,8000);
  switchTab('prompt');
  document.getElementById('previewStatus').innerText="Imported - Click Build";
 }catch(e){alert("Scrape failed, paste content manually sir")}
}

function uploadImage(){
 let f=document.getElementById('imageInput').files[0];
 if(!f) return;
 let reader=new FileReader();
 reader.onload=function(e){
  document.getElementById('imgPreview').src=e.target.result;
  document.getElementById('imgPreview').classList.remove('hidden');
  document.getElementById('promptInput').value+=" With image provided, use it as hero/product image.";
 }
 reader.readAsDataURL(f);
}

async function buildWebsite(){
 let prompt=document.getElementById('promptInput').value.trim();
 if(!prompt) return alert("Type what business you want sir - farm, mechanic, salon, anything");
 let stt=document.getElementById('statusText');
 tries++;
 stt.innerText='⏳ Try '+tries+'/4 building premium beauty...';
 document.getElementById('previewStatus').innerText="Building...";

 var rules = `
You are OMUGO AI 3.0 - PREMIUM WEBSITE BUILDER.

YOU CAN BUILD ANY BUSINESS - farm, mechanic workshop, salon, restaurant, fashion, tech, church, school, hospital, ANYTHING user types. NEVER say you cannot. ALWAYS build beautifully.

CRITICAL IMAGE RULE - DYNAMIC, NOT HARDCODED - THIS IS MOST IMPORTANT:
NEVER ever write <img src="Yams"> or <img src="Beans"> or <img src="mechanic"> or any word as src - THAT BREAKS AND SHOWS BROKEN ICON!
ALWAYS use real working image URL:
Use: https://source.unsplash.com/600x600/?KEYWORD1,KEYWORD2
How: Extract 2-3 keywords from user's business automatically.
Examples:
- User says "Emmanuel Clement Farms Yams Beans" -> use https://source.unsplash.com/600x600/?farm,yam and https://source.unsplash.com/600x600/?beans,agriculture and https://source.unsplash.com/600x600/?okra,vegetable and https://source.unsplash.com/600x600/?rice,farm
- User says "mechanic workshop spanner" -> use https://source.unsplash.com/600x600/?mechanic,garage and https://source.unsplash.com/600x600/?tools,spanner and https://source.unsplash.com/600x600/?car,repair
- User says "beauty salon" -> use https://source.unsplash.com/600x600/?salon,hair and https://source.unsplash.com/600x600/?beauty,makeup
For hero big image: https://source.unsplash.com/1200x800/?KEYWORD,farm OR mechanic OR business
If source.unsplash.com fails, fallback to https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&h=600&fit=crop&q=80

DESIGN RULES - HOSTINGER-LEVEL PREMIUM FOR ANY NICHE - MUST FOLLOW:
- ALWAYS use Tailwind CSS via CDN: <script src="https://cdn.tailwindcss.com"><\/script>
- Cards: class="bg-white rounded-[24px] shadow-xl p-6 border border-gray-100 hover:shadow-2xl transition"
- Sections: class="py-20 px-6 max-w-7xl mx-auto"
- Grids: class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"
- Buttons: class="bg-black text-white px-8 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition" OR bg-[#0A7A0A] OR bg-[#D4AF37] text-black
- Texts: class="text-2xl md:text-5xl font-bold" for headings
- Colors: Black #000000, Gold #D4AF37, Green #0A7A0A, White
- Layout flex-col md:flex-row
- Mobile-first!
- Never plain button like <button>Send</button> - ALWAYS styled!

STRUCTURE TO BUILD (for any business):
1. Header black with logo + business name + Search input + Cart + WhatsApp button
2. Hero: Big headline "FRESH FROM OUR FARM TO YOUR HOME" or relevant + subtext + 2 buttons Shop Now + WhatsApp Us + hero image
3. Shop by Category / Our Services grid with real images
4. Featured Products / Services grid with price, Add to Cart button (styled!)
5. Why Choose Us 4 cards
6. About section with image + story
7. Gallery 6 images grid
8. Testimonials 3 cards
9. Contact: Form Name Email Phone Message with styled inputs class="w-full border border-gray-300 rounded-[12px] p-4" + button Send Message styled + WhatsApp: Chat with us + Location: Abomey-Calavi, Benin + Delivery Info
10. Footer black: © ${new Date().getFullYear()} [Business Name] All rights reserved

Make every button real action with alert or WhatsApp link https://wa.me/2347035399931
Make cart working with JavaScript count.

USER PROMPT:
`;

 let fullPrompt = rules + prompt + "\n\nReturn ONLY complete single HTML file, no explanation, start with <!DOCTYPE html>";

 try{
  let response = await puter.ai.chat(fullPrompt, {model: "claude-3-5-sonnet"});
  let html = response.message.content[0].text || response.toString();
  // clean ```html
  html = html.replace(/```html/g,"").replace(/```/g,"").trim();
  if(!html.includes("<!DOCTYPE")) html="<!DOCTYPE html>\n"+html;
  currentHtml = html;
  let frame=document.getElementById('previewFrame');
  frame.srcdoc=html;
  stt.innerText="✅ Built successfully sir!";
  document.getElementById('previewStatus').innerText="Built";
  tries=0;
  // save to Puter KV for leads
  try{ await puter.kv.set('omugo_last_build', html); }catch(e){}
 }catch(err){
  stt.innerText="⚠️ Try "+tries+" failed, retrying... "+err.message;
  if(tries<4) setTimeout(buildWebsite, 2000);
  else stt.innerText="❌ Please click Build again sir, Puter needs login. Refresh and Allow.";
 }
}

async function publishSite(){
 if(!currentHtml) return alert("Build first sir");
 document.getElementById('previewStatus').innerText="Publishing...";
 try{
  // Try Puter hosting
  let blob = await puter.fs.write('omugo-site-'+Date.now()+'.html', currentHtml);
  let url = await puter.fs.getURL(blob.path);
  document.getElementById('liveLink').href=url;
  document.getElementById('liveLink').classList.remove('hidden');
  document.getElementById('previewStatus').innerText="Published!";
  alert("Published sir! Live link: "+url+" - Leads go to your WhatsApp 2347035399931");
 }catch(e){
  // Fallback JSONBlob
  try{
   let res=await fetch('https://jsonblob.com/api/jsonBlob',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:currentHtml})});
   let loc=res.headers.get('Location')||res.headers.get('location');
   let id=loc.split('/').pop();
   let url=location.origin+location.pathname+'?site='+id;
   document.getElementById('liveLink').href=url;
   document.getElementById('liveLink').classList.remove('hidden');
   document.getElementById('previewStatus').innerText="Published via JSONBlob";
  }catch(err){alert("Publish failed, use Download sir")}
 }
}

function downloadSite(){
 if(!currentHtml) return alert("Build first sir");
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([currentHtml],{type:'text/html'}));
 a.download='omugo-website.html';
 a.click();
}

// Load?site= id
(async()=>{
 let p=new URLSearchParams(location.search).get('site');
 if(p){
  try{
   let r=await fetch('https://jsonblob.com/api/jsonBlob/'+p);
   let j=await r.json();
   if(j.html){document.getElementById('previewFrame').srcdoc=j.html; currentHtml=j.html;}
  }catch(e){}
 }
})();
</script>
</body>
</html>
